<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather in Jordan</title>
    <style>
        /* Your existing CSS styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f8ff; 
            color: #333; 
            padding: 20px;
        }

        .container {
            max-width: 800px; 
            margin: 0 auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); 
        }

        h1 {
            text-align: center; 
            margin-bottom: 20px; 
            font-size: 2em; 
            color: #007bff; 
        }

        input[type="text"] {
            padding: 10px;
            width: calc(100% - 22px);
            border: 1px solid #007bff;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .city-card {
            background: #e9f5ff;
            border: 1px solid #007bff;
            border-radius: 5px;
            padding: 15px;
            margin: 10px;
            cursor: pointer;
            transition: transform 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .city-card:hover {
            transform: translateY(-5px);
        }

        .city-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        #weatherData {
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5em; 
            }

            .city-card {
                width: 100%;
            }
        }

        @media (min-width: 600px) {
            .city-card {
                width: calc(33% - 20px); /* Three cards per row */
                margin: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Weather in Jordan</h1>
        <input type="text" id="searchBar" placeholder="Search for a city..." />
        <div id="cityGrid" class="city-grid"></div>
        <div id="weatherData"></div>
    </div>
    <script src="weather.js"></script>
</body>
</html>
