<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countries Data</title>
  <link rel="stylesheet" href="countries.css">
  <style>
    /* Global styles */
body {
  font-family: Arial, sans-serif;
  background-color: #f4f4f4;
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

section {
  width: 90%;
  max-width: 1200px;
  margin: 20px auto;
  text-align: center;
}

h1 {
  font-size: 2.5em;
  color: #333;
  margin-bottom: 20px;
}

/* Container for the grid */
#countryDataContainer {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 20px;
  justify-content: center;
}

/* Each country item */
.country {
  background-color: white;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  transition: transform 0.2s, box-shadow 0.2s;
  padding: 20px;
  text-align: center;
}

.country:hover {
  transform: translateY(-10px);
  box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
}

/* Country flag styling */
.country img {
  width: 150px;
  height: auto;
  margin-bottom: 15px;
  border-radius: 8px;
  border: 1px solid #ddd;
}

/* Text styling */
.country p {
  margin: 10px 0;
  font-size: 1.1em;
  color: #333;
}

/* Country name */
.country p:first-of-type {
  font-weight: bold;
  font-size: 1.2em;
  color: #2c3e50;
}

/* Region text styling */
.country p:last-of-type {
  color: #7f8c8d;
  font-style: italic;
  font-size: 1em;
}

  </style>
</head>
<body>
  <section>
    <h1>Country Information</h1>
    <!-- Container to display the country data -->
    <div id="countryDataContainer"></div>
  </section>

  <script src="countries.js"></script>
</body>
</html>
